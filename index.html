<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Happy Birthday — An Interactive Storybook</title>
<meta name="description" content="An interactive 3D birthday book, decorated with light blue and white tulips.">

<!-- Typography: a display serif for elegance, a light sans for accents -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================
     SVG SPRITE — reusable tulip artwork (light blue / white)
     Defined once, referenced everywhere with <use> for performance.
     ============================================================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- A single stylised tulip head, built from three petal shapes -->
    <symbol id="tulip-blue" viewBox="0 0 60 70">
      <path class="petal petal-side" d="M30 68 C10 68 6 40 14 22 C18 13 25 8 30 8 C27 22 26 40 30 68 Z" fill="#AFD3E8"/>
      <path class="petal petal-side" d="M30 68 C50 68 54 40 46 22 C42 13 35 8 30 8 C33 22 34 40 30 68 Z" fill="#C9E2F0"/>
      <path class="petal petal-center" d="M30 68 C18 68 16 34 20 18 C23 8 30 4 30 4 C30 4 37 8 40 18 C44 34 42 68 30 68 Z" fill="#EAF5FB"/>
      <path class="petal-vein" d="M30 10 C30 28 30 48 30 66" stroke="#8FBFDD" stroke-width="1" fill="none" opacity="0.6"/>
    </symbol>

    <symbol id="tulip-white" viewBox="0 0 60 70">
      <path class="petal petal-side" d="M30 68 C10 68 6 40 14 22 C18 13 25 8 30 8 C27 22 26 40 30 68 Z" fill="#F2F7FB"/>
      <path class="petal petal-side" d="M30 68 C50 68 54 40 46 22 C42 13 35 8 30 8 C33 22 34 40 30 68 Z" fill="#FFFFFF"/>
      <path class="petal petal-center" d="M30 68 C18 68 16 34 20 18 C23 8 30 4 30 4 C30 4 37 8 40 18 C44 34 42 68 30 68 Z" fill="#FDFEFF"/>
      <path class="petal-vein" d="M30 10 C30 28 30 48 30 66" stroke="#D9E8F2" stroke-width="1" fill="none" opacity="0.7"/>
    </symbol>

    <!-- A simple curved stem + leaf, used beneath tulip heads -->
    <symbol id="tulip-stem" viewBox="0 0 40 100">
      <path d="M20 0 C20 30 20 60 20 98" stroke="#9FC9A8" stroke-width="2.4" fill="none"/>
      <path d="M20 45 C8 42 2 55 4 68 C16 66 22 56 20 45 Z" fill="#AFD9B8"/>
      <path d="M20 60 C32 58 38 70 36 82 C24 80 18 71 20 60 Z" fill="#9FCBA9"/>
    </symbol>

    <!-- Delicate corner ornament (filigree flourish) -->
    <symbol id="corner-flourish" viewBox="0 0 120 120">
      <path d="M4 4 C40 4 60 8 70 24 C80 40 78 60 60 66" stroke="#B9D8EA" stroke-width="1.4" fill="none"/>
      <path d="M4 4 C4 40 8 60 24 70 C40 80 60 78 66 60" stroke="#B9D8EA" stroke-width="1.4" fill="none"/>
      <circle cx="70" cy="24" r="3" fill="#B9D8EA"/>
      <circle cx="24" cy="70" r="3" fill="#B9D8EA"/>
    </symbol>
  </defs>
</svg>

<!-- ============================================================
     DREAMY BACKGROUND — gradient wash + ambient layers
     Petals / bokeh / sparkles are injected by script.js
     ============================================================ -->
<div class="background" aria-hidden="true">
  <div class="bg-gradient"></div>
  <div class="bg-glow bg-glow--one"></div>
  <div class="bg-glow bg-glow--two"></div>
  <div class="petal-layer" id="petalLayer"></div>
  <div class="bokeh-layer" id="bokehLayer"></div>
</div>

<!-- ============================================================
     MAIN STAGE — the interactive 3D book
     ============================================================ -->
<main class="stage">

  <p class="hint" id="hint">tap the book to open it</p>

  <div class="book-scene">
    <div class="book" id="book" role="button" tabindex="0"
         aria-label="Open your birthday card">

      <!-- soft ambient glow behind the book -->
      <div class="book-glow" id="bookGlow" aria-hidden="true"></div>

      <!-- BACK COVER — sits underneath, gives the book depth -->
      <div class="back-cover"></div>

      <!-- PAGE STACK — the visible page edges (side depth) -->
      <div class="page-edges" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <!-- INSIDE PAGES — revealed once the cover opens -->
      <div class="inside">
        <div class="page page-left">
          <div class="page-texture"></div>
          <svg class="corner corner-tl" viewBox="0 0 120 120"><use href="#corner-flourish"/></svg>
          <svg class="corner corner-bl" viewBox="0 0 120 120"><use href="#corner-flourish"/></svg>
          <div class="border-tulips border-tulips--left" aria-hidden="true"></div>

          <div class="sparkle-field" id="sparkleFieldLeft" aria-hidden="true"></div>

          <div class="page-content">
            <p class="eyebrow">a little something for</p>
            <h1 class="name-line">You</h1>
            <div class="ribbon-divider" aria-hidden="true">
              <svg viewBox="0 0 200 20" class="ribbon-svg">
                <path d="M0 10 C50 -2 150 22 200 10" stroke="#BFDCEE" stroke-width="1.5" fill="none"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="page page-right">
          <div class="page-texture"></div>
          <svg class="corner corner-tr" viewBox="0 0 120 120"><use href="#corner-flourish"/></svg>
          <svg class="corner corner-br" viewBox="0 0 120 120"><use href="#corner-flourish"/></svg>
          <div class="border-tulips border-tulips--right" aria-hidden="true"></div>

          <div class="sparkle-field" id="sparkleFieldRight" aria-hidden="true"></div>

          <div class="page-content">
            <p class="message-line message-line--1">Wishing you a day</p>
            <p class="message-line message-line--2">as lovely and rare</p>
            <p class="message-line message-line--3">as a tulip in bloom —</p>
            <p class="message-line message-line--4 message-line--emphasis">Happy Birthday</p>
            <div class="signature-flourish" aria-hidden="true">
              <svg viewBox="0 0 140 30" class="ribbon-svg">
                <path d="M0 15 C30 0 50 30 70 15 C90 0 110 30 140 15" stroke="#CBB68C" stroke-width="1.3" fill="none"/>
              </svg>
            </div>
            <p class="message-line message-line--5 message-line--soft">with warmth, wonder, and every good thing</p>
          </div>
        </div>
      </div>

      <!-- FRONT COVER — the piece that rotates open -->
      <div class="front-cover" id="frontCover">
        <div class="cover-texture"></div>
        <div class="cover-frame">
          <div class="cover-tulips" aria-hidden="true">
            <svg class="tulip tulip--tl" viewBox="0 0 60 70"><use href="#tulip-blue"/></svg>
            <svg class="tulip tulip--tr" viewBox="0 0 60 70"><use href="#tulip-white"/></svg>
            <svg class="stem stem--l" viewBox="0 0 40 100"><use href="#tulip-stem"/></svg>
            <svg class="stem stem--r" viewBox="0 0 40 100"><use href="#tulip-stem"/></svg>

            <svg class="tulip tulip--bl" viewBox="0 0 60 70"><use href="#tulip-white"/></svg>
            <svg class="tulip tulip--bm" viewBox="0 0 60 70"><use href="#tulip-blue"/></svg>
            <svg class="tulip tulip--br" viewBox="0 0 60 70"><use href="#tulip-white"/></svg>
          </div>

          <div class="cover-title">
            <span class="cover-title__eyebrow">— for someone wonderful —</span>
            <h2 class="cover-title__main">Happy<br>Birthday</h2>
            <span class="cover-title__rule"></span>
          </div>
        </div>
        <div class="cover-spine-shadow"></div>
        <div class="cover-sheen"></div>
      </div>

      <!-- spine -->
      <div class="spine" aria-hidden="true"></div>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
